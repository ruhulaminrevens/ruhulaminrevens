name: Build Laptop Check Pro EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'projects/LaptopCheckPro/**'
      - '.github/workflows/build-laptop-check-pro.yml'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: projects/LaptopCheckPro

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Validate Python source
        shell: pwsh
        run: python -m py_compile laptop_check_pro.py

      - name: Build single-file EXE
        shell: pwsh
        run: pyinstaller --noconfirm --clean --onefile --windowed --name LaptopCheckPro laptop_check_pro.py

      - name: Create SHA256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash .\dist\LaptopCheckPro.exe -Algorithm SHA256).Hash
          "$hash  LaptopCheckPro.exe" | Out-File -Encoding ascii .\dist\SHA256.txt

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: LaptopCheckPro-Windows
          path: |
            projects/LaptopCheckPro/dist/LaptopCheckPro.exe
            projects/LaptopCheckPro/dist/SHA256.txt
          if-no-files-found: error
          retention-days: 30
