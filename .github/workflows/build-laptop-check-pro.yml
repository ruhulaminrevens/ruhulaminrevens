name: Build Laptop Check Pro EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/LaptopCheckPro/**'
      - '.github/workflows/build-laptop-check-pro.yml'
  pull_request:
    branches: [main]
    paths:
      - 'projects/LaptopCheckPro/**'
      - '.github/workflows/build-laptop-check-pro.yml'

permissions:
  contents: read

concurrency:
  group: laptop-check-pro-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        working-directory: projects/LaptopCheckPro
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install build tools
        shell: pwsh
        run: python -m pip install -r requirements-build.txt
      - name: Validate Python and run regression tests
        shell: pwsh
        run: |
          python -m compileall -q .
          if ($LASTEXITCODE -ne 0) { throw 'Compilation failed' }
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Regression tests failed' }
          python smoke_test.py source-smoke.json
          if ($LASTEXITCODE -ne 0) { throw 'Source UI smoke test failed' }
      - name: Read application version
        id: version
        shell: pwsh
        run: |
          $version = python -c "from core import VERSION; print(VERSION)"
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid version' }
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Build single-file EXE
        shell: pwsh
        run: pyinstaller --noconfirm --clean --onefile --windowed --name LaptopCheckPro laptop_check_pro.py
      - name: Verify packaged Windows application
        shell: pwsh
        run: |
          $result = Join-Path $PWD 'packaged-smoke.json'
          $process = Start-Process -FilePath '.\dist\LaptopCheckPro.exe' -ArgumentList '--self-test', $result -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'Packaged app timed out' }
          if ($process.ExitCode -ne 0 -or -not (Test-Path $result)) { throw 'Packaged app smoke test failed' }
          if ((Get-Content $result | ConvertFrom-Json).result -ne 'PASS') { throw 'Invalid smoke result' }
      - name: Package Windows download and checksums
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: |
          $archive = "LaptopCheckPro-v$env:APP_VERSION-Windows.zip"
          Copy-Item README.md, LICENSE, CHANGELOG.md -Destination dist
          $hash = (Get-FileHash .\dist\LaptopCheckPro.exe -Algorithm SHA256).Hash
          "$hash  LaptopCheckPro.exe" | Set-Content -Encoding ascii .\dist\SHA256.txt
          Compress-Archive -Path .\dist\LaptopCheckPro.exe, .\dist\SHA256.txt, .\dist\README.md, .\dist\LICENSE, .\dist\CHANGELOG.md -DestinationPath ".\dist\$archive"
          $ziphash = (Get-FileHash ".\dist\$archive" -Algorithm SHA256).Hash
          "$ziphash  $archive" | Add-Content -Encoding ascii .\dist\SHA256.txt
          python -m zipfile -t ".\dist\$archive"
          if ($LASTEXITCODE -ne 0) { throw 'ZIP validation failed' }
      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LaptopCheckPro-v${{ steps.version.outputs.value }}-Windows
          path: |
            projects/LaptopCheckPro/dist/*
            projects/LaptopCheckPro/*-smoke.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish versioned GitHub Release
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.version.outputs.value }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          $tag = "laptop-check-pro-v$env:APP_VERSION"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Version already published; keeping original release assets. Bump VERSION for a new release.'
            exit 0
          }
          gh release create $tag ".\dist\LaptopCheckPro-v$env:APP_VERSION-Windows.zip" .\dist\LaptopCheckPro.exe .\dist\SHA256.txt --target $env:RELEASE_SHA --title "Laptop Check Pro v$env:APP_VERSION" --notes-file RELEASE_NOTES.md --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
